<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in - Inimai Matrimony</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body>
<main class="wrap"><div class="auth"><div class="side"><h2>Welcome back</h2><ul><li>See who liked you</li><li>Reply to interests</li><li>Check your new matches</li></ul></div>
<div class="main"><h2>Log in</h2><form id="f" class="f"><div><label>Email</label><input name="email" type="email" required></div><div><label>Password</label><input name="password" type="password" required></div><button class="btn">Log in</button><p id="e" class="err"></p><p style="margin:0">New here? <a href="register.html">Register free</a></p></form></div></div></main>
<script>layout();$('#f').onsubmit=async e=>{e.preventDefault();const r=await api('login',Object.fromEntries(new FormData(e.target)));if(r.error)$('#e').textContent=r.error;else location='dashboard.html'}</script></body></html>
