<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My account - Inimai Matrimony</title><link rel="stylesheet" href="style.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script><script src="firebase-config.js"></script><script src="app.js"></script></head><body>
<main class="wrap" id="m"></main>
<script>layout().then(m=>{if(m.guest)return location='login.html';const p=m.profile,ok=p.status==='approved';
const st=s=>({pending:'<span class="tag wait">Waiting for reply</span>',accepted:'<span class="tag ok">Accepted</span>',declined:'<span class="tag">Declined</span>'})[s||'pending'];
const row=(x,got)=>`<div class="box pf"><div class="av">${x.name[0]}</div><h3>${x.name}</h3><p>${x.age} years · ${x.religion}, ${x.caste}</p><p>${x.job} · ${x.city}</p>${x.phone?`<p>Phone: ${x.phone}</p>`:''}${got&&x.istatus==='pending'?`<button class="btn l rs" data-id="${x.id}" data-s="accepted">Accept</button> <button class="btn g rs" data-id="${x.id}" data-s="declined">Decline</button>`:st(x.istatus)}</div>`;
const pend=m.got.filter(x=>x.istatus==='pending').length;
$('#m').innerHTML=`<div class="wb"><h2>Welcome, ${p.name}</h2><p>${ok?'Your profile is live. Search profiles and send interest.':'Your profile will go live once our team approves it.'}</p></div><div class="grid w"><div class="box"><h3>Your profile</h3><span class="tag ${ok?'ok':'wait'}">${ok?'Live':'Waiting for approval'}</span><p>${p.gender}, ${p.age} years<br>${p.religion} · ${p.caste}<br>${p.job} · ${p.city}</p></div><div class="box"><h3>Your plan</h3><span class="tag">${m.plan}</span><p>${m.plan==='Free'?'Upgrade to see phone numbers.':'You can see phone numbers.'}</p><a class="btn g" href="plans.html">View plans</a></div><div class="box"><h3>Interests</h3><p>Received: <b>${m.got.length}</b> (${pend} waiting for your reply)<br>Sent: <b>${m.sentList.length}</b></p></div></div>
${m.got.length?`<h2 style="margin-top:32px">Interests you received</h2><div class="grid">${m.got.map(x=>row(x,1)).join('')}</div>`:''}
${m.sentList.length?`<h2 style="margin-top:32px">Interests you sent</h2><div class="grid">${m.sentList.map(x=>row(x,0)).join('')}</div>`:''}
<h2 style="margin-top:32px">Matches for you</h2><div class="grid">${m.match.map(x=>card(x,m)).join('')||'<div class="box">No matches yet. Check again soon.</div>'}</div><p><button class="btn g" id="o">Log out</button></p>`;
$('#o').onclick=async()=>{await api('logout',{});location='index.html'}})</script></body></html>
