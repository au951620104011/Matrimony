<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register - Inimai Matrimony</title><link rel="stylesheet" href="style.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script><script src="firebase-config.js"></script><script src="app.js"></script></head><body>
<main class="wrap"><div class="auth"><div class="side"><h2>Find your life partner</h2><ul><li>Free profile</li><li>Matches picked for you</li><li>Send and receive interests</li><li>Verified by our team</li></ul></div>
<div class="main"><h2>Create your profile</h2><form id="f" class="fg"><div class="full"><label>Full name</label><input name="name" required></div><div><label>Profile for</label><select name="gender"><option value="Groom">Groom (male)</option><option value="Bride">Bride (female)</option></select></div><div><label>Age</label><input name="age" type="number" min="18" max="60" required></div><div><label>Religion</label><select name="religion"><option>Hindu</option><option>Christian</option><option>Muslim</option></select></div><div><label>Community</label><select name="caste" id="c"></select></div><div><label>Job</label><input name="job"></div><div><label>City</label><input name="city"></div><div class="full"><label>Mobile number</label><input name="phone" type="tel" required></div><div class="full"><label>Email</label><input name="email" type="email" required></div><div class="full"><label>Password (6+ characters)</label><input name="password" type="password" minlength="6" required></div>
<div class="full"><button class="btn" style="width:100%">Create profile</button></div><p id="e" class="err full"></p><p class="full" style="margin:0">Already registered? <a href="login.html">Log in</a></p></form></div></div></main>
<script>layout();$('#c').innerHTML=opts(CASTES);$('#f').onsubmit=async e=>{e.preventDefault();const r=await api('register',Object.fromEntries(new FormData(e.target)));if(r.error)$('#e').textContent=r.error;else location='dashboard.html'}</script></body></html>
