<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Inimai Matrimony</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body>
<main class="wrap"><div id="lg" class="narrow box"><h2>Admin login</h2><form id="lf" class="f"><input name="password" type="password" placeholder="Admin password"><button class="btn">Log in</button><p id="e" class="err"></p></form></div>
<div id="pn" hidden><h2>Add a bride or groom</h2><form id="af" class="box f2"><div><label>Name</label><input name="name" required></div><div><label>Gender</label><select name="gender"><option>Bride</option><option>Groom</option></select></div><div><label>Age</label><input name="age" type="number" required></div><div><label>Religion</label><select name="religion"><option>Hindu</option><option>Christian</option><option>Muslim</option></select></div><div><label>Community</label><select name="caste" id="c"></select></div><div><label>Job</label><input name="job"></div><div><label>City</label><input name="city"></div><div><label>Phone</label><input name="phone"></div><div><button class="btn">Add profile</button></div></form>
<h2 style="margin-top:32px">All profiles</h2><div class="scroll box"><table id="t"></table></div></div></main>
<script>layout();$('#c').innerHTML=opts(CASTES);
async function load(){const l=await api('admin/list');if(l.error)return;$('#lg').hidden=true;$('#pn').hidden=false;
$('#t').innerHTML='<tr><th>Name</th><th>Gender</th><th>Age</th><th>Community</th><th>City</th><th>Phone</th><th>Added by</th><th>Status</th><th>Plan</th><th></th></tr>'+l.map(x=>`<tr><td>${x.name}</td><td>${x.gender}</td><td>${x.age}</td><td>${x.caste}</td><td>${x.city}</td><td>${x.phone}</td><td>${x.by}</td><td>${x.status}</td><td>${x.userId?`<select onchange="act('plan',{userId:'${x.userId}',plan:this.value})">${['Free','Silver','Gold','Platinum'].map(p=>`<option ${p===x.plan?'selected':''}>${p}</option>`).join('')}</select><br><small>${x.email}</small>`:'-'}</td><td>${x.status==='pending'?`<button class="btn l" onclick="act('approve',{id:'${x.id}'})">Approve</button> `:''}<button class="btn g" onclick="confirm('Delete this profile?')&&act('delete',{id:'${x.id}'})">Delete</button></td></tr>`).join('')}
async function act(a,b){await api('admin/'+a,b);load()}
$('#lf').onsubmit=async e=>{e.preventDefault();const r=await api('admin/login',Object.fromEntries(new FormData(e.target)));if(r.error)$('#e').textContent=r.error;else load()};
$('#af').onsubmit=async e=>{e.preventDefault();await api('admin/add',Object.fromEntries(new FormData(e.target)));e.target.reset();load()};load()</script></body></html>
